name: Build Android APK

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  love-payload:
    name: Build shared payload (.love)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build shared payload
        run: |
          scripts/pack_love.sh \
            --output dist/payload/game.love \
            --listing dist/payload/love-listing.txt \
            --version "0.1.0"

      - name: Upload shared payload
        uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-release-love
          path: dist/payload/game.love
          if-no-files-found: error
          retention-days: 1

  android-apk:
    name: Build Android APK
    needs: love-payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Download shared payload
        uses: actions/download-artifact@v4
        with:
          name: gen1recomp-release-love
          path: .bazinga/work

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          set -euo pipefail
          scripts/build_android.sh --version "0.1.0"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-android-apk
          path: dist/android/debug/*.apk
          if-no-files-found: error
          retention-days: 7
